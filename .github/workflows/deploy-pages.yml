name: Deploy web app to GitHub Pages

# Publishes the Milton's Properties web app to
# https://natty2027.github.io/MiltonsProperties/. The app is fully client-side
# (pre-qualification runs the shared prequalify() in-browser), so no backend or
# secrets are required.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build web app
        env:
          # GitHub Pages project site is served from /<repo>/.
          BASE_PATH: /MiltonsProperties/
        run: pnpm --filter @workspace/web build

      - name: Add SPA deep-link fallback
        run: cp apps/web/dist/public/index.html apps/web/dist/public/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
